<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora</title>
    <style>
        :root {
            --bg-color: #000000;
            --btn-digit-bg: #1B1B1B;
            --btn-text-color: #FFFFFF;
            --btn-orange-text: #FF8516;
            --btn-equal-bg: #FF8516;
            --display-text-white: #FFFFFF;
            --display-text-gray: rgba(255, 255, 255, 0.5);
            --cursor-color: #007AFF;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Indicador Secreto en barra superior simulada */
        #magic-dot {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 5px;
            height: 5px;
            z-index: 100;
            opacity: 0.3;
        }
        .dot-ready { background-color: white; border-radius: 50%; width: 5px; height: 5px; }
        .dot-insufficient { background-color: white; border-radius: 0; width: 8px; height: 2px; margin-top: 2px; }

        /* Visor Xiaomi Flow */
        #display-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            text-align: right;
            overflow-y: auto;
        }

        #expression {
            font-size: 32px;
            color: var(--display-text-white);
            word-break: break-all;
            transition: all 0.3s ease;
            line-height: 1.2;
        }
        #expression.history-mode {
            color: var(--display-text-gray);
            font-size: 26px;
        }

        #result {
            font-size: 32px;
            color: var(--display-text-gray);
            margin-top: 10px;
            min-height: 1.2em;
            opacity: 0;
            transition: all 0.3s ease;
        }
        #result.visible { opacity: 1; }
        #result.final-mode {
            color: var(--display-text-white);
            font-size: 64px;
            opacity: 1;
        }

        #cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: var(--cursor-color);
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Teclado */
        #keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 15px;
            padding-bottom: 30px;
        }

        .btn {
            height: 75px;
            border-radius: 22px;
            border: none;
            background-color: var(--btn-digit-bg);
            color: var(--btn-text-color);
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: filter 0.1s;
        }
        .btn:active { filter: brightness(1.5); }
        .btn-func { color: var(--btn-orange-text); }
        .btn-equal { background-color: var(--btn-equal-bg); color: white; }

        .icon-svg { width: 34px; height: 34px; fill: currentColor; }

        /* Modales */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 1000;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-content { max-width: 500px; margin: auto; width: 100%; }
        h2 { color: var(--btn-orange-text); margin-top: 0; }
        h3 { border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 30px; font-family: serif; }
        p { line-height: 1.6; font-size: 15px; }
        .btn-modal {
            width: 100%; height: 55px; border-radius: 18px; border: none;
            margin-top: 20px; font-size: 18px; font-weight: bold;
            background: var(--btn-equal-bg); color: white;
        }
        .btn-secondary { background: #333; margin-top: 10px; }

        input, select {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px;
            border: 1px solid #333; background: #111; color: white;
            font-size: 16px; box-sizing: border-box;
        }
        label { color: #888; font-size: 12px; text-transform: uppercase; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div id="magic-dot"></div>

    <div id="display-area" onclick="onDoubleTap()">
        <div id="expression">0<span id="cursor"></span></div>
        <div id="result">= 0</div>
    </div>

    <div id="keypad">
        <button class="btn btn-func"
                onmousedown="handleACDown()" onmouseup="handleACUp()"
                ontouchstart="handleACDown()" ontouchend="handleACUp()">AC</button>
        <button class="btn btn-func" onclick="onBackspace()">
            <!-- Icono Backspace Xiaomi Exacto -->
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22,3H7c-0.69,0-1.23,0.35-1.59,0.88L0,12l5.41,8.11C5.77,20.64,6.31,21,7,21h15c1.1,0,2-0.9,2-2V5C24,3.9,23.1,3,22,3z M18.3,16.3l-1.4,1.4L13,13.8l-3.9,3.9l-1.4-1.4l3.9-3.9l-3.9-3.9l1.4-1.4l3.9,3.9l3.9-3.9l1.4,1.4L14.4,12.5L18.3,16.3z"/></svg>
        </button>
        <button class="btn btn-func" onclick="onOperator('%')">%</button>
        <button class="btn btn-func" onclick="onOperator('÷')">÷</button>

        <button class="btn" onclick="onDigit('7')">7</button>
        <button class="btn" onclick="onDigit('8')">8</button>
        <button class="btn" onclick="onDigit('9')">9</button>
        <button class="btn btn-func" onclick="onOperator('×')">×</button>

        <button class="btn" onclick="onDigit('4')">4</button>
        <button class="btn" onclick="onDigit('5')">5</button>
        <button class="btn" onclick="onDigit('6')">6</button>
        <button class="btn btn-func" onclick="onOperator('-')">-</button>

        <button class="btn" onclick="onDigit('1')">1</button>
        <button class="btn" onclick="onDigit('2')">2</button>
        <button class="btn" onclick="onDigit('3')">3</button>
        <button class="btn btn-func" onclick="onOperator('+')">+</button>

        <button class="btn">
            <!-- Icono Conversion Xiaomi Exacto -->
            <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M7 10h4v4h-4zM13 10h4v4h-4z" opacity=".3"/>
                <path d="M19 8c-0.3-1.2-1.1-2.3-2.2-3l0.8-1.5L14 5l3.1 1.5l0.8-1.5c0.7 0.4 1.2 1.1 1.6 1.8 0.4 1.1 0.3 2.3-0.3 3.3l1.3 1.3C21.7 11 21.8 9.4 19 8z"/>
                <path d="M5 16c0.3 1.2 1.1 2.3 2.2 3l-0.8 1.5L10 19l-3.1-1.5-0.8 1.5c-0.7-0.4-1.2-1.1-1.6-1.8-0.4-1.1-0.3-2.3 0.3-3.3l-1.3-1.3C2.3 13 2.2 14.6 5 16z"/>
                <rect x="8" y="8" width="5" height="5" rx="1" stroke="#FF8516" stroke-width="1.5" fill="none"/>
                <rect x="11" y="11" width="5" height="5" rx="1" stroke="#FF8516" stroke-width="1.5" fill="none"/>
            </svg>
        </button>
        <button class="btn" onclick="onDigit('0')">0</button>
        <button class="btn" onclick="onDot()">,</button>
        <button class="btn btn-equal" onclick="onEquals()">=</button>
    </div>

    <!-- Mensaje de Bienvenida -->
    <div id="welcome-modal" class="modal">
        <div class="modal-content">
            <h2 id="txt-welcome-title">Bienvenido</h2>
            <p id="txt-welcome-msg">Para acceder al menú secreto mantén presionado AC durante 3 segundos.</p>
            <button class="btn-modal" onclick="closeWelcome()">Aceptar</button>
            <button class="btn-modal btn-secondary" onclick="disableWelcome()">NO VOLVER A MOSTRAR</button>
        </div>
    </div>

    <!-- Menu Secreto -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2 style="font-family: serif; letter-spacing: 1px;">GRIMORIO ARCANO</h2>

            <label>Modo de Forzaje</label>
            <select id="set-mode" onchange="toggleSettingsUI()">
                <option value="FECHA_HORA">Fecha / Hora</option>
                <option value="RESULTADO_FIJO">Resultado Fijo</option>
                <option value="REVELACION_PASO_A_PASO">Revelación Paso a Paso</option>
            </select>

            <div id="ui-fixed" style="display:none">
                <label>Número a forzar</label>
                <input type="number" id="set-fixed" placeholder="1234.56">
            </div>

            <div id="ui-secret" style="display:none">
                <label>Número secreto</label>
                <input type="text" id="set-secret" placeholder="9876">
            </div>

            <label>Acceso Remoto</label>
            <p style="font-size: 12px; font-style: normal; margin-bottom: 2px;">Utiliza este enlace desde otro dispositivo:</p>
            <input type="text" value="https://rb.gy/5xmw4r" readonly style="color: var(--btn-orange-text); border-color: var(--btn-orange-text);">

            <h3 style="font-family: serif; font-weight: bold; border-bottom: 2px solid #FF8516;">Tratado de la Aritmética Arcano</h3>
            <div id="tutorial-body" style="font-style: italic; font-family: serif; font-size: 14px; color: #aaa; padding: 10px 0;"></div>

            <button class="btn-modal" onclick="saveAndClose()">Sellar y Guardar</button>
        </div>
    </div>

    <script>
        let display = "0";
        let history = "";
        let prevVal = null;
        let pendingOp = null;
        let startFresh = true;
        let isResultMode = false;

        let armed = false;
        let revealIdx = 0;
        let currentTargetStr = "";

        let lastTap = 0;
        let acTimer = null;

        const config = JSON.parse(localStorage.getItem('pf_config')) || {
            mode: 'FECHA_HORA',
            fixed: '100',
            secret: '2024',
            hideWelcome: false
        };

        window.onload = () => {
            if (!config.hideWelcome) document.getElementById('welcome-modal').style.display = 'flex';
            initTexts();
            updateDisplay();
        };

        function initTexts() {
            const lang = navigator.language.substring(0, 2);
            const dict = {
                es: {
                    welcome: "Bienvenido",
                    msg: "Para acceder al menú secreto mantén presionado AC durante 3 segundos.",
                    accept: "Aceptar",
                    never: "NO VOLVER A MOSTRAR",
                    tutorial: `<b>LIBRO DEL ILUSIONISTA v1.27</b><br><br>Estimado maestro de las sombras,<br><br>Este artefacto ha sido forjado para subvertir las leyes de la lógica ante los ojos del profano. Para que tu ilusión sea impecable, debes dominar estas lecciones:<br><br><b>I. EL DESPERTAR DEL ARTEFACTO</b><br>Toca dos veces con presteza el visor superior. Un minúsculo punto en la bóveda de tu dispositivo indicará que la magia está lista.<br><br><b>II. LA VOLUNTAD DEL MAGO (EL FORZAJE)</b><br>Tras invocar un signo aritmético, el artefacto se someterá a tu voluntad. Cualquier cifra que el espectador trace, solo escribirá lo necesario para alcanzar el destino que tú has marcado.<br><br><b>III. LA LIMPIEZA DEL ESCENARIO (GHOST ARM)</b><br>Borrar dígitos individuales preserva el encanto. Solo al invocar el conjuro 'AC', el artefacto se purificará y regresará a su estado mundano.<br><br><b>IV. DESVANECIMIENTO (PÁNICO)</b><br>Si el secreto corre peligro, golpea tres veces la tecla '='. El artefacto se cerrará al instante.`
                },
                en: {
                    welcome: "Welcome",
                    msg: "To access the secret menu, press and hold AC for 3 seconds.",
                    accept: "Accept",
                    never: "DON'T SHOW AGAIN",
                    tutorial: `<b>ILLUSIONIST'S HANDBOOK v1.27</b><br><br>Dear Master of Shadows,<br><br>This artifact has been crafted to subvert logic before the eyes of the uninitiated. For your illusion to be flawless, master these lessons:<br><br><b>I. AWAKENING THE ARTIFACT</b><br>Quickly double-tap the upper display. A tiny dot will signal that the magic is ready.<br><br><b>II. THE MAGICIAN'S WILL (THE FORCE)</b><br>After invoking an arithmetic sign, the artifact submits to your will. Any digit the spectator types will only reveal what is needed to reach the destination you pre-ordained.<br><br><b>III. STAGE CLEANUP (GHOST ARM)</b><br>Deleting single digits preserves the charm. Only the 'AC' spell will purify the artifact and return it to its mundane state.`
                },
                pt: {
                    welcome: "Bem-vindo",
                    msg: "Para acessar o menu secreto, mantenha pressionado AC por 3 segundos.",
                    accept: "Aceitar",
                    never: "NÃO MOSTRAR NOVAMENTE",
                    tutorial: `<b>LIVRO DO ILUSIONISTA v1.27</b><br><br>Caro Mestre das Sombras...`
                }
            };
            const t = dict[lang] || dict.es;
            document.getElementById('txt-welcome-title').innerText = t.welcome;
            document.getElementById('txt-welcome-msg').innerText = t.msg;
            document.querySelectorAll('.btn-modal')[0].innerText = t.accept;
            document.querySelectorAll('.btn-secondary')[0].innerText = t.never;
            document.getElementById('tutorial-body').innerHTML = t.tutorial;
        }

        function format(val) {
            if (isNaN(val)) return "Error";
            let s = val.toString().split('.');
            s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return s.join(',');
        }

        function updateDisplay() {
            const expEl = document.getElementById('expression');
            const resEl = document.getElementById('result');
            const dotEl = document.getElementById('magic-dot');

            if (isResultMode) {
                expEl.innerText = history;
                expEl.classList.add('history-mode');
                resEl.innerText = "= " + format(display);
                resEl.classList.add('final-mode');
                resEl.classList.add('visible');
            } else {
                let fullExp = history ? history + " " + display : display;
                expEl.innerHTML = fullExp + '<span id="cursor"></span>';
                expEl.classList.remove('history-mode');

                if (pendingOp && !startFresh) {
                    let cur = parseFloat(display.replace(/\./g, '').replace(',', '.'));
                    let live = op(prevVal || 0, cur, pendingOp);
                    resEl.innerText = "= " + format(live);
                    resEl.classList.add('visible');
                    resEl.classList.remove('final-mode');
                } else if (pendingOp && startFresh) {
                    resEl.innerText = "= " + format(prevVal);
                    resEl.classList.add('visible');
                } else {
                    resEl.classList.remove('visible');
                }
            }

            dotEl.className = "";
            if (armed) {
                let target = getTarget();
                let insufficient = false;
                if (config.mode === 'REVELACION_PASO_A_PASO') insufficient = (revealIdx < target.length);
                else if (pendingOp) insufficient = (!currentTargetStr || revealIdx < currentTargetStr.length);
                dotEl.className = insufficient ? "dot-insufficient" : "dot-ready";
            }
        }

        function op(a, b, s) {
            if (s === '+') return a + b;
            if (s === '-') return a - b;
            if (s === '×') return a * b;
            if (s === '÷') return b !== 0 ? a / b : NaN;
            return b;
        }

        function onDigit(d) {
            if (display.replace(/[.,]/g, '').length >= 20 && !startFresh) return;
            if (isResultMode) { onClear(); }

            if (armed) {
                let target = getTarget();
                if (config.mode === 'REVELACION_PASO_A_PASO') {
                    if (revealIdx < target.length) {
                        display = (revealIdx === 0) ? target[revealIdx] : display + target[revealIdx];
                        revealIdx++; startFresh = false; updateDisplay(); return;
                    }
                } else if (pendingOp) {
                    if (!currentTargetStr) {
                        let tVal = parseFloat(target.replace(/\./g, '').replace(',', '.'));
                        let need = 0;
                        if (pendingOp === '+') need = tVal - prevVal;
                        if (pendingOp === '-') need = prevVal - tVal;
                        if (pendingOp === '×') need = prevVal !== 0 ? tVal / prevVal : 0;
                        if (pendingOp === '÷') need = tVal !== 0 ? prevVal / tVal : 0;
                        currentTargetStr = format(need).replace(/[.-]/g, '');
                        revealIdx = 0;
                    }
                    if (revealIdx < currentTargetStr.length) {
                        let n = currentTargetStr[revealIdx];
                        if (n === ',' && display.includes(',')) { revealIdx++; onDigit(d); return; }
                        display = startFresh ? n : display + n;
                        revealIdx++; startFresh = false; updateDisplay(); return;
                    }
                    return; // Bloqueo
                }
            }

            display = (startFresh || display === "0") ? d : display + d;
            startFresh = false;
            updateDisplay();
        }

        function getTarget() {
            if (config.mode === 'RESULTADO_FIJO') return config.fixed;
            if (config.mode === 'REVELACION_PASO_A_PASO') return config.secret;
            let n = new Date();
            return [n.getDate(), n.getMonth()+1, n.getFullYear(), n.getHours(), n.getMinutes()].map(x=>x.toString().padStart(2,'0')).join('');
        }

        function onOperator(s) {
            let cur = parseFloat(display.replace(/\./g, '').replace(',', '.'));
            if (isResultMode) {
                history = format(cur) + " " + s;
                prevVal = cur;
                isResultMode = false;
            } else {
                if (pendingOp && !startFresh) {
                    prevVal = op(prevVal, cur, pendingOp);
                    history += " " + format(cur) + " " + s;
                    display = format(prevVal);
                } else if (pendingOp && startFresh) {
                    history = history.slice(0, -1) + s;
                } else {
                    history = format(cur) + " " + s;
                    prevVal = cur;
                }
            }
            pendingOp = s; startFresh = true; currentTargetStr = ""; revealIdx = 0; updateDisplay();
        }

        function onEquals() {
            if (isResultMode || !pendingOp) return;
            let target = getTarget();
            let force = armed && ((config.mode === 'REVELACION_PASO_A_PASO' && revealIdx >= target.length) || (currentTargetStr && revealIdx >= currentTargetStr.length));

            if (force) {
                history += " " + display;
                display = format(parseFloat(target.replace(/\./g, '').replace(',', '.')));
                armed = false;
            } else {
                let cur = parseFloat(display.replace(/\./g, '').replace(',', '.'));
                display = format(op(prevVal, cur, pendingOp));
                history += " " + format(cur);
            }
            prevVal = null; pendingOp = null; startFresh = true; isResultMode = true; updateDisplay();
        }

        function onClear() {
            display = "0"; history = ""; prevVal = null; pendingOp = null;
            startFresh = true; isResultMode = false; armed = false;
            currentTargetStr = ""; revealIdx = 0; updateDisplay();
        }

        function onBackspace() {
            if (startFresh || isResultMode) return;
            display = display.length > 1 ? display.slice(0, -1) : "0";
            updateDisplay();
        }

        function onDot() {
            if (isResultMode) { onClear(); display = "0,"; startFresh = false; return; }
            if (startFresh) { display = "0,"; startFresh = false; }
            else if (!display.includes(',')) display += ",";
            updateDisplay();
        }

        function onDoubleTap() {
            let now = Date.now();
            if (now - lastTap < 300) { armed = !armed; revealIdx = 0; currentTargetStr = ""; updateDisplay(); }
            lastTap = now;
        }

        function handleACDown() { acTimer = setTimeout(() => { document.getElementById('settings-modal').style.display = 'flex'; toggleSettingsUI(); }, 3000); }
        function handleACUp() { clearTimeout(acTimer); }

        function closeWelcome() { document.getElementById('welcome-modal').style.display = 'none'; }
        function disableWelcome() { config.hideWelcome = true; saveAndClose(); closeWelcome(); }

        function toggleSettingsUI() {
            const m = document.getElementById('set-mode').value;
            document.getElementById('ui-fixed').style.display = (m === 'RESULTADO_FIJO') ? 'block' : 'none';
            document.getElementById('ui-secret').style.display = (m === 'REVELACION_PASO_A_PASO') ? 'block' : 'none';
            document.getElementById('set-fixed').value = config.fixed;
            document.getElementById('set-secret').value = config.secret;
        }

        function saveAndClose() {
            config.mode = document.getElementById('set-mode').value;
            config.fixed = document.getElementById('set-fixed').value;
            config.secret = document.getElementById('set-secret').value;
            localStorage.setItem('pf_config', JSON.stringify(config));
            document.getElementById('settings-modal').style.display = 'none';
        }
    </script>
</body>
</html>
