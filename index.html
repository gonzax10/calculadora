<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --btn-digit: #333333;
            --btn-op: #ff9f0a;
            --btn-func: #a5a5a5;
        }
        body {
            margin: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #history {
            height: 40px; text-align: right; padding: 20px 20px 0;
            font-size: 20px; color: rgba(255,255,255,0.6); overflow: hidden; white-space: nowrap;
        }
        #display {
            flex: 1; display: flex; align-items: flex-end; justify-content: flex-end;
            padding: 20px; font-size: 80px; font-weight: 200; overflow: hidden;
        }
        .grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px;
        }
        button {
            aspect-ratio: 1/1; border-radius: 50%; border: none; font-size: 32px;
            color: white; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        button:active { filter: brightness(1.5); }
        .digit { background-color: var(--btn-digit); }
        .op { background-color: var(--btn-op); }
        .func { background-color: var(--btn-func); color: black; }
        .zero { grid-column: span 2; aspect-ratio: auto; border-radius: 50px; text-align: left; padding-left: 35px; }
        
        /* Ajustes Ocultos */
        #settings-dialog {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="history"></div>
    <div id="display" ontouchstart="handleDisplayTouch()">0</div>
    <div class="grid">
        <button class="func" onmousedown="startCHold()" onmouseup="endCHold()" ontouchstart="startCHold()" ontouchend="endCHold()">C</button>
        <button class="func" onclick="press('back')">⌫</button>
        <button class="func" onclick="press('%')">%</button>
        <button class="op" onclick="press('÷')">÷</button>
        <button class="digit" onclick="press('7')">7</button>
        <button class="digit" onclick="press('8')">8</button>
        <button class="digit" onclick="press('9')">9</button>
        <button class="op" onclick="press('×')">×</button>
        <button class="digit" onclick="press('4')">4</button>
        <button class="digit" onclick="press('5')">5</button>
        <button class="digit" onclick="press('6')">6</button>
        <button class="op" onclick="press('-')">-</button>
        <button class="digit" onclick="press('1')">1</button>
        <button class="digit" onclick="press('2')">2</button>
        <button class="digit" onclick="press('3')">3</button>
        <button class="op" onclick="press('+')">+</button>
        <button class="digit zero" onclick="press('0')">0</button>
        <button class="digit" onclick="press('.')">.</button>
        <button class="op" onclick="press('=')">=</button>
    </div>

    <!-- Menú de Ajustes -->
    <div id="settings-dialog">
        <h2>Ajustes Mágicos</h2>
        <label>Modo: 
            <select id="magic-mode">
                <option value="time">Fecha / Hora</option>
                <option value="fixed">Resultado Fijo</option>
            </select>
        </label><br><br>
        <label>Número Fijo: <input type="number" id="fixed-val" value="12345"></label><br><br>
        <label>Minutos Offset: <input type="number" id="offset-val" value="0"></label><br><br>
        <button onclick="closeSettings()" style="background: #2ecc71; border-radius: 8px; aspect-ratio: auto; padding: 10px 20px;">Guardar y Cerrar</button>
    </div>

    <script>
        let display = "0";
        let history = "";
        let armed = false;
        let pendingOp = null;
        let prevVal = null;
        let startFresh = true;
        let revealIdx = 0;
        let lastTap = 0;
        let cTimer;
        let panicCount = 0;
        let lastPanicTime = 0;

        function updateUI() {
            document.getElementById('display').innerText = display;
            document.getElementById('history').innerText = history;
            // Ajustar fuente si es largo
            if (display.length > 8) document.getElementById('display').style.fontSize = "40px";
            else document.getElementById('display').style.fontSize = "80px";
        }

        function press(key) {
            const now = Date.now();
            
            // Modo Pánico (3x =)
            if (key === '=') {
                if (now - lastPanicTime < 2000) panicCount++;
                else panicCount = 1;
                lastPanicTime = now;
                if (panicCount >= 3) { window.location.reload(); return; }
            }

            if (!isNaN(key) || key === '.') {
                handleDigit(key);
            } else {
                handleOp(key);
            }
            updateUI();
        }

        function handleDigit(d) {
            if (armed) {
                let target = getTarget();
                if (pendingOp && prevVal !== null) {
                    // Revelación inteligente por diferencia
                    let targetNum = parseFloat(target);
                    let diff = targetNum - prevVal; // Simplificado a suma para el ejemplo web
                    let diffStr = Math.abs(diff).toString().replace(".", "");
                    if (revealIdx < diffStr.length) {
                        display = (startFresh) ? diffStr[revealIdx] : display + diffStr[revealIdx];
                        revealIdx++;
                        startFresh = false;
                    }
                    return;
                } else {
                    // Revelación directa
                    if (revealIdx < target.length) {
                        display = (revealIdx === 0) ? target[revealIdx] : display + target[revealIdx];
                        revealIdx++;
                        startFresh = false;
                    }
                    return;
                }
            }
            if (startFresh || display === "0") { display = d; startFresh = false; }
            else display += d;
        }

        function handleOp(op) {
            if (op === 'C') {
                display = "0"; history = ""; prevVal = null; pendingOp = null; startFresh = true;
            } else if (op === '=') {
                if (armed) {
                    display = getTarget();
                    history += " " + display + " =";
                    armed = false;
                } else if (prevVal !== null && pendingOp) {
                    history += " " + display + " =";
                    display = eval(prevVal + pendingOp.replace('×','*').replace('÷','/') + display).toString();
                }
                prevVal = null; pendingOp = null; startFresh = true;
            } else {
                prevVal = parseFloat(display);
                pendingOp = op;
                history = display + " " + op;
                startFresh = true;
                if (armed) revealIdx = 0;
            }
        }

        function getTarget() {
            const mode = document.getElementById('magic-mode').value;
            if (mode === 'fixed') return document.getElementById('fixed-val').value;
            
            const offset = parseInt(document.getElementById('offset-val').value);
            const now = new Date(Date.now() + offset * 60000);
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = String(now.getFullYear());
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            return d + m + y + hh + mm;
        }

        // Gestos Mágicos
        function handleDisplayTouch() {
            const now = Date.now();
            if (now - lastTap < 300) { armed = !armed; alert(armed ? "Sistema Listo" : "Modo Normal"); }
            lastTap = now;
        }

        function startCHold() { cTimer = setTimeout(() => { document.getElementById('settings-dialog').style.display = "block"; }, 3000); }
        function endCHold() { clearTimeout(cTimer); }
        function closeSettings() { document.getElementById('settings-dialog').style.display = "none"; }
    </script>
</body>
</html>
