<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Calculadora</title>
    <style>
        :root { 
            --bg-color: #000000; 
            --text-color: #ffffff; 
            --btn-digit: #333333; 
            --btn-op: #ff9f0a; 
            --btn-func: #a5a5a5; 
            --btn-func-text: #000000;
        }
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body { 
            margin: 0; background-color: var(--bg-color); color: var(--text-color); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; 
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: flex-end;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            -webkit-touch-callout: none;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        #status-dot { position: fixed; top: 15px; right: 25px; width: 6px; height: 6px; background: white; border-radius: 50%; opacity: 0; transition: opacity 0.3s; z-index: 1000; pointer-events: none; }
        #status-dot.show { opacity: 1; }
        
        #screen-container {
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 0 24px 15px 24px; width: 100%;
            cursor: pointer;
            margin-bottom: 5px;
        }

        #history { 
            height: 24px; text-align: right; font-size: 18px; 
            color: rgba(255,255,255,0.5); overflow: hidden; white-space: nowrap; 
            display: flex; align-items: flex-end; justify-content: flex-end; 
            margin-bottom: 2px; pointer-events: none;
        }
        
        #display-container {
            display: flex; align-items: flex-end; justify-content: flex-end;
            overflow: hidden; width: 100%; min-height: 80px; pointer-events: none;
        }
        #display {
            font-size: 78px; font-weight: 300; white-space: nowrap; text-align: right;
            line-height: 1; letter-spacing: -1px;
        }
        
        .grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 12px; padding: 0 16px; width: 100%; z-index: 10; 
        }
        
        button { 
            aspect-ratio: 1/1; border-radius: 50%; border: none; 
            font-size: 32px; font-weight: 400; color: white; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            transition: filter 0.1s;
            width: 100%;
        }
        button:active { filter: brightness(1.4); }
        
        .digit { background-color: var(--btn-digit); color: #ffffff; }
        .op { background-color: var(--btn-op); color: #ffffff; font-size: 38px; }
        .func { background-color: var(--btn-func); color: var(--btn-func-text); font-weight: 400; }
        
        #settings-dialog { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; overflow-y: auto; padding: 25px; color: white; cursor: default; }
        #settings-dialog h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .instruction-box { background: #111; border-left: 4px solid #ff9f0a; padding: 10px 15px; margin-top: 15px; font-size: 14px; line-height: 1.4; color: #ccc; border-radius: 0 8px 8px 0; }
        .instruction-box b { color: #fff; }
        
        .stepper-container { display: flex; align-items: center; justify-content: space-between; background: #222; border: 1px solid #444; border-radius: 5px; padding: 5px 10px; margin-top: 5px; }
        .stepper-btn { background: #333; color: white; border: none; width: 36px; height: 36px; border-radius: 4px; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .stepper-btn:active { background: #555; }
        #time-offset-val { font-size: 18px; font-weight: bold; color: #ff9f0a; }
    </style>
</head>
<body>
    <div id="status-dot"></div>
    
    <div id="screen-container" onclick="handleMagicTouch()">
        <div id="history"></div>
        <div id="display-container">
            <div id="display">0</div>
        </div>
    </div>

    <div class="grid">
        <!-- Hilera 1 -->
        <button class="func" onclick="press('C')" onmousedown="startCHold()" onmouseup="endCHold()" ontouchstart="startCHold()" ontouchend="endCHold()"><span id="c-label">AC</span></button>
        <button class="func" onclick="press('back')">⌫</button>
        <button class="func" onclick="press('%')">%</button>
        <button class="op" onclick="press('÷')">÷</button>
        
        <!-- Hilera 2 -->
        <button class="digit" onclick="press('7')">7</button>
        <button class="digit" onclick="press('8')">8</button>
        <button class="digit" onclick="press('9')">9</button>
        <button class="op" onclick="press('×')">×</button>
        
        <!-- Hilera 3 -->
        <button class="digit" onclick="press('4')">4</button>
        <button class="digit" onclick="press('5')">5</button>
        <button class="digit" onclick="press('6')">6</button>
        <button class="op" onclick="press('-')">-</button>
        
        <!-- Hilera 4 -->
        <button class="digit" onclick="press('1')">1</button>
        <button class="digit" onclick="press('2')">2</button>
        <button class="digit" onclick="press('3')">3</button>
        <button class="op" onclick="press('+')">+</button>
        
        <!-- Hilera 5 -->
        <button class="digit" onclick="press('+/-')">±</button>
        <button class="digit" onclick="press('0')">0</button>
        <button class="digit" onclick="press('.')">,</button>
        <button class="op" onclick="press('=')">=</button>
    </div>

    <!-- Menú de Ajustes Mágicos -->
    <div id="settings-dialog">
        <h2>Ajustes Mágicos</h2>
        <label>Modo de Magia:<br>
            <select id="magic-mode" onchange="updateInstructions()" style="width:100%; padding:8px; margin-top:5px; background:#222; color:white; border:1px solid #444; border-radius:5px;">
                <option value="time">Fecha / Hora</option>
                <option value="fixed">Número Fijo</option>
            </select>
        </label><br><br>

        <label>Formato Fecha:<br>
            <select id="date-format" style="width:100%; padding:8px; margin-top:5px; background:#222; color:white; border:1px solid #444; border-radius:5px;">
                <option value="ddmmaa">DD/MM/AA</option>
                <option value="ddmmaaaa">DD/MM/AAAA</option>
            </select>
        </label><br><br>

        <label>Ajuste de Minutos (Extra / Resta):<br>
            <div class="stepper-container">
                <button class="stepper-btn" onclick="changeOffset(-1)">-</button>
                <span id="time-offset-val">0 min</span>
                <button class="stepper-btn" onclick="changeOffset(1)">+</button>
            </div>
        </label><br>

        <label>Número Fijo (si usas ese modo):<br>
            <input type="number" id="fixed-val" value="12345" style="width:100%; padding:8px; margin-top:5px; background:#222; color:white; border:1px solid #444; border-radius:5px;">
        </label>

        <div id="instruction-text" class="instruction-box"></div>

        <br>
        <button onclick="closeSettings()" style="width:100%; padding:12px; background:#2ecc71; border:none; color:white; font-weight:bold; border-radius:8px; font-size:16px; cursor:pointer;">Guardar y Cerrar</button>
    </div>

    <script>
        let display = "0", history = "", armed = false, pendingOp = null, prevVal = null, startFresh = true, revealIdx = 0, lastTap = 0, cTimer, panicCount = 0, lastPanicTime = 0, isHolding = false;
        let timeOffsetMinutes = 0;

        function changeOffset(val) {
            timeOffsetMinutes += val;
            document.getElementById('time-offset-val').innerText = (timeOffsetMinutes > ? "+" + timeOffsetMinutes : timeOffsetMinutes) + " min";
        }
        
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

        function updateUI() {
            const dispElem = document.getElementById('display');
            dispElem.innerText = display.replace('.', ',');
            document.getElementById('history').innerText = history;
            
            document.getElementById('c-label').innerText = (display === "0" && history === "") ? "AC" : "C";

            dispElem.style.fontSize = "78px";
            let len = display.length;
            if (len > 6 && len <= 9) {
                dispElem.style.fontSize = "58px";
            } else if (len > 9) {
                dispElem.style.fontSize = "42px";
            }
        }

        function toggleStatusDot(show) { document.getElementById('status-dot').className = show ? 'show' : ''; }
        
        function press(key) {
            if (isHolding) return;

            const now = Date.now();
            
            if (key === '=') {
                if (now - lastPanicTime < 2000) {
                    panicCount++;
                } else {
                    panicCount = 1;
                }
                lastPanicTime = now;
                
                if (panicCount >= 3) {
                    window.location.href = "about:blank"; 
                    return;
                }
            }
            
            if (key === 'C') {
                display = "0"; history = ""; prevVal = null; pendingOp = null; startFresh = true;
            } else if (key === 'back') {
                display = display.length > 1 ? display.slice(0, -1) : "0";
            } else if (!isNaN(key) || key === '.') {
                handleDigit(key);
            } else if (key === '+/-') {
                if (display !== "0") {
                    display = display.startsWith('-') ? display.slice(1) : '-' + display;
                }
            } else {
                handleOp(key);
            }
            updateUI();
        }
        
        function handleDigit(d) {
            if (armed) {
                let target = getTarget();
                if (pendingOp && prevVal !== null) { 
                    let diffStr = Math.abs(parseFloat(target) - prevVal).toString().replace(".", ""); 
                    if (revealIdx < diffStr.length) { display = (startFresh) ? diffStr[revealIdx] : display + diffStr[revealIdx]; revealIdx++; startFresh = false; } 
                } else { 
                    if (revealIdx < target.length) { display = (revealIdx === 0) ? target[revealIdx] : display + target[revealIdx]; revealIdx++; startFresh = false; } 
                }
            } else { 
                if (d === '.') {
                    if (!display.includes('.')) display += '.';
                } else {
                    if (startFresh || display === "0") { display = d; startFresh = false; } else display += d; 
                }
            }
        }
        
        function handleOp(op) {
            if (op === '=') {
                if (armed) { display = getTarget(); history += " " + display + " ="; armed = false; toggleStatusDot(false); }
                else if (prevVal !== null && pendingOp) { history += " " + display + " ="; display = eval(prevVal + pendingOp.replace('×','*').replace('÷','/') + display).toString(); }
                prevVal = null; pendingOp = null; startFresh = true;
            } else if (op === '%') {
                if (!isNaN(display)) { display = (parseFloat(display) / 100).toString(); }
            } else { 
                prevVal = parseFloat(display); 
                pendingOp = op; 
                history = display + " " + op; 
                startFresh = true; 
                if (armed) revealIdx = 0; 
            }
        }
        
        function getTarget() {
            const mode = document.getElementById('magic-mode').value;
            if (mode === 'fixed') {
                return document.getElementById('fixed-val').value;
            }
            const now = new Date();
            if (timeOffsetMinutes !== 0) {
                now.setMinutes(now.getMinutes() + timeOffsetMinutes);
            }
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = document.getElementById('date-format').value === 'ddmmaa' ? String(now.getFullYear()).slice(-2) : String(now.getFullYear());
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            return d + m + y + hh + mm;
        }
        
        function handleMagicTouch() {
            const now = Date.now(); 
            if (now - lastTap < 400) { 
                armed = !armed; 
                toggleStatusDot(armed); 
            } 
            lastTap = now; 
        }
        
        function startCHold() { 
            isHolding = false;
            cTimer = setTimeout(() => { 
                isHolding = true;
                updateInstructions();
                document.getElementById('settings-dialog').style.display = "block"; 
            }, 2000); 
        }
        function endCHold() { 
            clearTimeout(cTimer); 
            setTimeout(() => { isHolding = false; }, 100);
        }
        function closeSettings() { document.getElementById('settings-dialog').style.display = "none"; }

        function updateInstructions() {
            const mode = document.getElementById('magic-mode').value;
            const box = document.getElementById('instruction-text');
            if (mode === 'time') {
                box.innerHTML = `<b>Modo Fecha / Hora:</b><br>Haz doble toque en la zona superior para activar el punto blanco. Al tipear, revelará la fecha y hora incluyendo los minutos ajustados.`;
            } else {
                box.innerHTML = `<b>Modo Número Fijo:</b><br>Haz doble toque en la zona superior para activar el punto blanco. Al presionar las teclas, forzará el número fijo.`;
            }
        }
    </script>
</body>
</html>
